name: NHO Portal Scraper (Python)

on:
  # Schedule disabled — run manually from the Actions tab.
  # To re-enable, uncomment:
  # schedule:
  #   - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      probe:
        description: 'Run auth probe only (no data write)'
        required: false
        default: false
        type: boolean

concurrency:
  group: nho-portal-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Scrapling browser engine (Camoufox)
        run: |
          scrapling install || echo "WARN: scrapling install failed; mirror tier will still work"

      - name: Probe auth options
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe }}
        env:
          LIFERAY_USER: ${{ secrets.LIFERAY_USER }}
          LIFERAY_PASS: ${{ secrets.LIFERAY_PASS }}
          NHO_CLIENT_ID: ${{ secrets.NHO_CLIENT_ID }}
          NHO_CLIENT_SECRET: ${{ secrets.NHO_CLIENT_SECRET }}
        run: |
          python nho_fetch.py probe

      - name: Upload probe dump
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe }}
        uses: actions/upload-artifact@v4
        with:
          name: nho-combined-dump
          path: recon/nho-combined.json
          if-no-files-found: ignore

      - name: Run NHO scraper
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.probe }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          LIFERAY_USER: ${{ secrets.LIFERAY_USER }}
          LIFERAY_PASS: ${{ secrets.LIFERAY_PASS }}
          NHO_CLIENT_ID: ${{ secrets.NHO_CLIENT_ID }}
          NHO_CLIENT_SECRET: ${{ secrets.NHO_CLIENT_SECRET }}
        run: |
          python nho_fetch.py

      - name: Archive stale warnings
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.probe }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          npm ci
          npm run cleanup -- --execute

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-debug
          path: recon/
          if-no-files-found: ignore
