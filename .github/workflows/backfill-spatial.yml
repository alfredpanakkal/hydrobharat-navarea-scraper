name: Backfill spatial (per-warning segmentation)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview changes without writing'
        type: boolean
        default: true

concurrency:
  group: backfill-spatial
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Run backfill
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: npx tsx src/backfillSpatial.ts
